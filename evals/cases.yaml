# Eval cases: the same input, a good-enough output (practice.md, spec.md §7).
# input = the task the agent receives; knowledge/web_results = what the stubbed tools return; teacher = scripted answers to ask_user;
# phase: lesson (default) | revise (files exist, the teacher sends a note) | final (the teacher is satisfied).
# expect = exact checks on tool calls and fields. Wording is only checked where a rubric exists and --judge is on (ticket #28).
# Start with real cases and grow this file every time the agent surprises you.
- id: approval-basic-en
  group: approval
  task: 'Prepare a lesson. Topic: Data types. Grade: K10. Length: 45 minutes. Language: English. Class level: Mixed class. Create: Lesson plan
    (.docx). Web search is turned off: do not use it. The teacher chose these options from a menu, so do not ask for them again.'
  knowledge:
  - file: data-types.pdf
    location: page 3
    text: Numeric data are numbers such as age or price. Categorical data are labels such as city or colour. Dates are a special type.
  expect:
    called:
    - search_knowledge
    - ask_user
    approval_before_files: true
    files_created_any:
    - .docx
