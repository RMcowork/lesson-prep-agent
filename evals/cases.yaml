- id: revise-shorter-warmup
  group: revise
  task: 'Prepare a lesson. Topic: Data types.'
  phase: revise
  knowledge:
  - file: data-types.pdf
    location: page 3
    text: Numeric data are numbers such as age or price. Categorical data are labels such as city or colour. Dates are a special type.
  seed_files:
  - name: lesson-plan
    title: Lesson plan
    text: 'Warm-up (10 minutes): discuss data in daily life. Main activity (25 minutes). Quiz (10 minutes).'
  - name: quiz
    title: Quiz
    text: Q1 What is numeric data? Q2 Give an example of categorical data.
  note: 'Make the warm-up shorter: 5 minutes instead of 10.'
  expect:
    recreated:
    - lesson-plan
    not_called:
    - create_xlsx
    - create_pptx
    ask_user_max: 0
